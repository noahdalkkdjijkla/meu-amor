<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8c2c45"><title>Nossas Fotos</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="center"><a class="back" href="index.html" aria-label="Voltar">←</a><h1 class="script">Nossas Fotos</h1></header>
<main><div class="grid f" id="g"></div></main>
<div id="lb" onclick="this.style.display='none'"><img id="lbi" alt=""></div>
<script>
var N = 5, MIN = 8, g = document.getElementById('g');
function card(src){
  var c = document.createElement('div'); c.className = 'pol';
  var im = document.createElement('div'); im.className = 'im';
  if (src){
    var img = new Image();
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = ''; img.src = src;
    im.appendChild(img);
    im.onclick = function(){ document.getElementById('lbi').src = src; document.getElementById('lb').style.display = 'flex'; };
  } else im.innerHTML = '<span class="ph">Foto</span>';
  c.appendChild(im); g.appendChild(c);
}
for (var i = 1; i <= N; i++) card('Fotos/' + i + '.jpeg');
for (var j = N; j < MIN; j++) card(null);
</script>
<script src="musica.js"></script>
</body></html>
