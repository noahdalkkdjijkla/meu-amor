<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8c2c45"><title>Nossos Vídeos</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="center"><a class="back" href="index.html" aria-label="Voltar">←</a><h1 class="script">Nossos Vídeos</h1></header>
<main><div class="grid v" id="g"></div></main>
<script>
// Vídeos na pasta "videos": 1.mp4, 2.mp4, 3.mp4... Mude N para a quantidade de vídeos.
var N = 3, EXT = 'mp4', MIN = 6, g = document.getElementById('g');
function card(src){
  var c = document.createElement('div'); c.className = 'vid';
  var s = document.createElement('div'); s.className = 'scr';
  if (src){
    var v = document.createElement('video');
    v.controls = true; v.preload = 'metadata'; v.playsInline = true;
    v.src = src + '#t=0.1';
    s.appendChild(v);
  } else s.innerHTML = '<span class="ph">Vídeo</span>';
  c.appendChild(s);
  var b = document.createElement('div'); b.className = 'bar'; c.appendChild(b);
  g.appendChild(c);
}
for (var i = 1; i <= N; i++) card('videos/' + i + '.' + EXT);
for (var j = N; j < MIN; j++) card(null);
</script>
<script src="music.js"></script>
</body></html>
